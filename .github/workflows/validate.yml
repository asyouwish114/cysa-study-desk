name: Validate and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate study data
        run: node scripts/validate-data.mjs
      - name: Run unit tests
        run: npm test
